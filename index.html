<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine pe tot ecranul</title>
    <style>
        /* Resetăm marginile implicite ale paginii */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ascunde orice bară de derulare */
            background-color: #000; /* Fundal negru de siguranță */
        }

        /* Forțăm imaginea să ocupe exact 100% din lățime și înălțime */
        .full-screen-img {
            width: 100vw;   /* 100% din lățimea ecranului */
            height: 100vh;  /* 100% din înălțimea ecranului (vertical) */
            object-fit: contain; /* Umple tot ecranul păstrând proporțiile (taie puțin din margini dacă proporțiile diferă) */
            display: block;
        }
    </style>
</head>
<body>

    <img src="CduyK.jpeg" alt="Imagine ecran complet" class="full-screen-img">

</body>
</html>
